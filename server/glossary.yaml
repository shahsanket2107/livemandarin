# Vocabulary for your meetings. Edit while the server runs; changes apply to the next sentence.
#
# asr_hints: English words people say mid-sentence (names, products, jargon). A short,
#            relevant list roughly halves recognition errors on technical terms. Keep it to
#            15–30 words: a long list dilutes the hints and measured as bad as none.
# terms:     fixed Chinese ↔ English translations, applied only when the term is spoken
#            (both directions). Also use them to repair known mis-hearings, e.g. 三K → Sanket.

asr_hints:
  - Sanket
  - Claude Code
  - Skill
  - cluster
  - backtest
  - indicator
  - tier one
  - tier two
  - tier three
  - deploy
  - PR
  - API
  - Kubernetes
  - Python
  - dashboard
  - latency

