  - zh: 回滚
    en: rollback
  - zh: 联调
    en: integration testing
  - zh: 压测
    en: load testing
  - zh: 埋点
    en: event tracking
  - zh: 需求
    en: requirement
  - zh: 排期
    en: scheduling
  - zh: 复盘
    en: retrospective
  - zh: 对齐
    en: align
